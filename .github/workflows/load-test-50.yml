name: CargoIQ 50-business load test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run 50-business authenticated pilot test
        env:
          CARGOIQ_LOAD_TEST_URL: ${{ secrets.CARGOIQ_LOAD_TEST_URL }}
          CARGOIQ_TEST_TOKENS: ${{ secrets.CARGOIQ_TEST_TOKENS }}
          NAHALLM_URL: ${{ secrets.NAHALLM_URL }}
          NAHALLM_API_KEY: ${{ secrets.NAHALLM_API_KEY }}
          LOAD_TEST_CONCURRENCY: '50'
        run: node scripts/load-test-50.mjs