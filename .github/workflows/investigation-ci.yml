name: CargoIQ investigation CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: cargoiq-investigation-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Investigation unit checks
        run: npm run test:investigation

      - name: Forecasting unit checks
        run: npm run test:forecasting

      - name: Investigation vertical checks
        run: npm run test:investigation:vertical

      - name: TimesFM runtime syntax check
        run: python -m py_compile services/timesfm/app.py

      - name: Drizzle schema export
        run: npx drizzle-kit export --config=drizzle.config.ts > /tmp/cargoiq-schema.sql

      - name: Migration runner syntax
        run: node --experimental-strip-types --check scripts/migrate-investigation.ts

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Start production server
        env:
          CARGOIQ_E2E_MODE: true
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/cargoiq-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/cargoiq-health.json; then
              cat /tmp/cargoiq-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cargoiq-next.log
          exit 1

      - name: Browser smoke — investigation
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e:investigation
