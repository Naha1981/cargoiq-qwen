name: CargoIQ investigation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/investigative-evidence-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Investigation unit checks
        run: npm run test:investigation

      - name: Production build
        run: npm run build
